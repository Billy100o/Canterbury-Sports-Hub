# Put this file at: .github/workflows/tas-scraper.yml
#
# Runs the scraper automatically after Saturday sport, commits the fresh
# data.json back into the repo, and Vercel picks up that commit and redeploys
# the dashboard — no one has to touch anything by hand.
#
# QLD doesn't do daylight saving (always UTC+10), so 10:00 UTC = 8:00pm QLD.
# Push results usually finish being entered by early evening, but nudge this
# later (or add a second run) if TAS results tend to land after 8pm.

name: Scrape TAS results

on:
  schedule:
    - cron: '0 10 * * 6' # 8:00pm QLD time, every Saturday
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install playwright
      - run: npx playwright install --with-deps chromium

      - run: node tas-scraper.js

      - name: Commit updated data.json
        run: |
          git config user.name "tas-scraper-bot"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update TAS results $(date -u +%F)"
          git push
